<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom must work (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04181c" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      Brand mark, transparent so it sits on whatever the tab paints behind it.
      32px is what Chrome and Firefox actually sample; the .ico carries 16/32/48
      for Windows pins and older engines that ignore rel="icon" PNGs.
    -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-16.png" sizes="16x16" />
    <!-- iOS discards alpha and rounds the corners itself, so this one is opaque. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
