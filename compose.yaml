services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Live source for HMR.
      - .:/app
      # Named volume keeps the container's Linux-built node_modules from being
      # shadowed by the host directory.
      - node_modules:/app/node_modules
    environment:
      # Set to 1 if edits on the host don't trigger HMR (slow/odd bind mounts).
      VITE_POLL: ""
    stdin_open: true
    tty: true

volumes:
  node_modules:
